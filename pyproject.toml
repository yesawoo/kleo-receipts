[project]
name = "kleo-receipts"
dynamic = ["version"]
description = "Epson receipt printer based task ticket system"
readme = "README.md"
license = "MIT"
authors = [{ name = "yesawoo" }]
requires-python = ">=3.12"
keywords = ["receipt-printer", "escpos", "epson", "task-management", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-escpos>=3.1",
    "zeroconf>=0.131.0",
    "things.py>=0.0.15",
    "schedule>=1.2.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yesawoo/kleo-receipts"
Repository = "https://github.com/yesawoo/kleo-receipts"

[project.scripts]
kleo = "kleo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kleo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kleo"]

[tool.hatch.build.targets.sdist]
include = ["kleo/", "LICENSE", "README.md", "pyproject.toml"]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "escpos.*",
    "usb.*",
    "things",
    "mcp.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.1",
]
