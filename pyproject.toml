[project]
name = "kleo-receipts"
version = "0.1.0"
description = "Epson receipt printer based task ticket system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-escpos>=3.1",
    "zeroconf>=0.131.0",
    "things.py>=0.0.15",
    "schedule>=1.2.0",
]

[project.scripts]
kleo = "kleo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kleo"]
